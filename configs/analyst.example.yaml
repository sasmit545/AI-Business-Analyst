# Reference configuration. Runtime reads Settings and the documented .env keys.
# This YAML is explanatory; it is not loaded by the application.
llm:
  provider: nvidia
  transport: openai_chat_completions
  base_url: https://integrate.api.nvidia.com/v1
  model: nvidia/nemotron-3.5-super-vl-120b-a12b
  api_key_env: NVIDIA_API_KEY
  temperature: 1
  top_p: 0.95
  max_tokens: 4096
  seed: 42
  stream: true
  # The analyst dispatches tools serially under one investigation budget.
  parallel_tool_calls: false
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
  # These are investigation-wide limits, distinct from max_tokens per call.
  # The operator confirmed free NVIDIA credits.
  max_investigation_tokens: 32768
  max_investigation_cost_usd: 0
  free_credits: true
